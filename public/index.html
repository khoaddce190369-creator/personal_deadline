<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Deadline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- Màn hình Đăng nhập -->
  <div class="container" id="login-container">
    <header>
      <h1>ĐĂNG NHẬP</h1>
      <p>Nhập ID và mã PIN lấy từ Bot Telegram (/web)</p>
    </header>
    <div class="login-box">
      <input type="text" id="chat-id-input" placeholder="Nhập ID Telegram..." class="input-field">
      <input type="password" id="pin-input" placeholder="Nhập mã PIN..." class="input-field">
      <button onclick="login()" class="btn-main">Đăng Nhập</button>
      <p id="login-error" style="color: var(--danger); font-size: 14px; display: none;">Sai thông tin đăng nhập!</p>
    </div>
  </div>

  <!-- Màn hình Quản lý Deadline -->
  <div class="container" id="app-container" style="display: none;">
    <header>
      <h1>QUẢN LÝ DEADLINE</h1>
      <p>Hệ thống tự động nhắc hẹn qua Telegram</p>
      <button onclick="logout()" class="btn-del" style="margin-top: 10px;">Đăng xuất</button>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="loadDeadlines('active')">ĐANG CHỜ</button>
      <button class="tab-btn" onclick="loadDeadlines('completed')">ĐÃ XONG</button>
    </div>

    <div id="deadline-list" class="deadline-list">
      <!-- Dữ liệu sẽ được load ở đây -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.9/dayjs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
