<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Deadline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Quản lý Deadline</h1>
      <p>Hệ thống tự động nhắc hẹn qua Telegram</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="loadDeadlines('active')">Đang chờ</button>
      <button class="tab-btn" onclick="loadDeadlines('completed')">Đã xong</button>
    </div>

    <div id="deadline-list" class="deadline-list">
      <!-- Dữ liệu sẽ được load ở đây -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.9/dayjs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
